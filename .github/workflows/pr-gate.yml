name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: ${{ github.event.pull_request.draft && 'Draft CI (local only)' || 'PR Gate' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      ACC_ROUTING_MD: ${{ github.workspace }}/hooks/fixtures/ROUTING.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fast portable suite
        run: npm test
      - name: Expose the integration diff to covgate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --quiet
            BASE_SHA=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
            git reset --soft "$BASE_SHA"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            git reset --soft "${{ github.event.merge_group.base_sha }}"
          fi
      - name: Changed-file coverage gate
        run: npm run covgate
